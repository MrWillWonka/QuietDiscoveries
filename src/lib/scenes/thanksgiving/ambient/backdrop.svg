<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
<!-- An autumn farm on a bright, clear November afternoon. A clear blue sky
     over soft mauve and peach hills, a golden meadow beyond the fence, and
     fresh green grass with a sandy path curving up to the gap in the fence.
     The sun, the clouds, the trees, the barn, the windmill, the fence and
     everything standing in the field are Ambient Life pieces, so they stay
     their own shape and layer with the animals. The middle of the sky is
     kept empty for a Note. Ground animals walk the savanna's band (62% to
     97% of the way down). -->
<defs><linearGradient id="thanksgiving-backdrop-sky" x1="0" y1="0" x2="0" y2="620" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#8ccaee"/><stop offset="1" stop-color="#e2f2f9"/></linearGradient></defs>
