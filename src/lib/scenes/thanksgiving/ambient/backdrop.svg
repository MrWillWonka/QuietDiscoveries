<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="none">
<!-- An autumn farm field at golden late afternoon in November. The sky runs
     from a pale, cool blue overhead to warm gold at the hills; the sun, the
     clouds, the far trees, the barn, the fence and everything standing in the
     field are Ambient Life pieces, so they stay round and layer with the
     animals. The middle of the sky is kept empty for a Note. The field is
     open from the far edge (y 630) to the bottom, so ground animals walk the
     savanna's band (62% to 97% of the way down). -->
<defs><linearGradient id="thanksgiving-backdrop-sky" x1="0" y1="0" x2="0" y2="640" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d9e4e4"/><stop offset="1" stop-color="#fbdca0"/></linearGradient></defs>
<rect width="1920" height="1080" fill="url(#thanksgiving-backdrop-sky)"/>
